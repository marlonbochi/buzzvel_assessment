name: Live site checks

# Runs the e2e suite and the Lighthouse budgets against the deployed site:
# - automatically, when Vercel reports a successful deployment of a commit on main
#   (Vercel's Git integration sets a commit status with the context "Vercel");
# - manually, from the Actions tab (optionally against another URL, e.g. a preview).
on:
  status:
  workflow_dispatch:
    inputs:
      url:
        description: URL to test
        required: false
        default: https://buzzvel-assessment.vercel.app

permissions:
  contents: read

concurrency:
  group: live-checks
  cancel-in-progress: true

jobs:
  live:
    name: E2E + Lighthouse on the live site
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.context == 'Vercel' && github.event.state == 'success' &&
       contains(github.event.branches.*.name, 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIVE_URL: ${{ inputs.url || 'https://buzzvel-assessment.vercel.app' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Test the code that was deployed, not whatever main points to now.
          ref: ${{ github.event.sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end against ${{ env.LIVE_URL }}
        run: pnpm test:e2e
        env:
          BASE_URL: ${{ env.LIVE_URL }}
      - name: Lighthouse budgets against ${{ env.LIVE_URL }}
        if: success() || failure()
        run: pnpm lhci
        env:
          LHCI_URL: ${{ env.LIVE_URL }}/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-reports
          path: |
            playwright-report
            test-results
            .lighthouseci
          include-hidden-files: true
          retention-days: 7
