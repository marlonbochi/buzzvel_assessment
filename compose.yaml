name: luma

services:
  # Development server with hot reload: http://localhost:3000
  dev:
    build:
      context: .
      target: dev
    ports:
      - "${DEV_PORT:-3000}:3000"
    environment:
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

  # Storybook component catalogue: http://localhost:6006
  storybook:
    build:
      context: .
      target: dev
    command: ["pnpm", "storybook", "--host", "0.0.0.0", "--ci", "--no-open"]
    ports:
      - "${STORYBOOK_PORT:-6006}:6006"
    environment:
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - /app/node_modules

  # Optimized production build (standalone, non-root): http://localhost:8080
  prod:
    build:
      context: .
      target: runner
    ports:
      - "${PROD_PORT:-8080}:3000"
    environment:
      CONTACT_DELAY_MS: "600"
