name: luma

services:
  # Development server with hot reload: http://localhost:3000
  dev:
    build:
      context: .
      target: dev
    ports:
      - "${DEV_PORT:-3000}:3000"
    environment:
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

  # Storybook component catalogue: http://localhost:6006
  storybook:
    build:
      context: .
      target: dev
    command: ["pnpm", "storybook", "--host", "0.0.0.0", "--ci", "--no-open"]
    ports:
      - "${STORYBOOK_PORT:-6006}:6006"
    environment:
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - /app/node_modules

  # Optimized production build (standalone, non-root): http://localhost:8080
  prod:
    build:
      context: .
      target: runner
    ports:
      - "${PROD_PORT:-8080}:3000"
    environment:
      CONTACT_DELAY_MS: "600"

  # End-to-end suite against the production container: docker compose --profile test run --rm e2e
  e2e:
    profiles: ["test"]
    image: mcr.microsoft.com/playwright:v1.65.0-noble
    working_dir: /app
    depends_on:
      prod:
        condition: service_healthy
    environment:
      BASE_URL: http://prod:3000
      CI: "true"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      # Keep pnpm's store inside the container, not in the bind-mounted project.
      npm_config_store_dir: /tmp/pnpm-store
    volumes:
      - .:/app
      - /app/node_modules
    command: >-
      sh -c "npm i -g pnpm@10.34.9 --silent && pnpm install --frozen-lockfile && pnpm exec playwright test"
